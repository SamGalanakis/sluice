# Not a package. The fn helper lives in python/ and fns run with `uv run --no-project`.
# This project only gives the repository a standard-library Python environment (`.venv`):
# the engine acceptance gates run crates/sluice/tests/acceptance/fixtures/private_config.py
# with `.venv/bin/python`, and the client gate runs `uv run python`.
[project]
name = "sluice"
version = "0.1.0"
requires-python = ">=3.12"

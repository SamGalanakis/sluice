[project]
name = "sluice"
version = "0.1.0"
description = "A controlled firehose: agents edit a typed plan of functions; a runner executes it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10",
    "jsonpatch>=1.33",
    "uvicorn>=0.30",
]

[project.scripts]
sluice = "sluice.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests", "packs"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

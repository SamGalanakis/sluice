# Not a package. The fn helper lives in python/ and fns run with `uv run --no-project`.
# This project only gives `uv run --project <repo> --no-sync python|pytest` an environment:
# the import-python-home fixtures (legacy-python-fixture/) and the offline cutover-staging
# tests, which crates/sluice-runtime/tests/staging.rs runs with pytest.
[project]
name = "sluice"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

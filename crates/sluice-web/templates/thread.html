<div id="messages-view"><h1>Thread</h1><nav class="seg" aria-label="Messages"><a href="{{ view.base() }}/inbox">Inbox</a><a href="{{ view.base() }}/questions">Questions</a><a href="{{ view.base() }}/history">History</a></nav>
{% for thread in view.threads %}<section data-read-url="{{ thread.read_url() }}" data-thread="{{ thread.thread }}" data-through="{{ thread.through }}"><h2>{{ thread.project_name }} · {{ thread.thread }}</h2><ol class="msgs">{% for item in thread.messages %}{% include "message.html" %}{% endfor %}</ol>
<form class="thread-reply" data-ignore-morph style="display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:18px" method="post" action="/projects/id/{{ thread.project }}/messages"><input type="hidden" name="thread" value="{{ thread.thread }}"><label for="thread-body">Message to the thread</label><textarea id="thread-body" style="width:100%" name="body" rows="3" required aria-label="Message to the thread"></textarea><label><input type="checkbox" name="needs_reply" value="true"> Ask a follow-up question</label><button class="primary">Send</button><p class="ou-status" role="status"></p></form></section>{% endfor %}
{% if view.threads.is_empty() %}<p class="empty">No messages in this thread.</p>{% endif %}<script type="module" src="/static/inbox.js"></script></div>

<header class="top"><div class="wrap top-in">
<button type="button" class="ghost menu-btn" aria-label="Open projects" aria-controls="sidebar" aria-expanded="false" data-nav-open>{{ crate::views::icons::icon(crate::views::icons::Icon::Menu, 16, "")|safe }}</button>
{{ crate::views::top_nav(nav, path)|safe }}
{% if !stream.is_empty() %}<span class="stream" role="status">Updates paused<button type="button" data-reopens-stream data-on:click="{{ crate::views::ui::stream_reopen(stream) }}">Reconnect</button></span>{% endif %}
</div></header>

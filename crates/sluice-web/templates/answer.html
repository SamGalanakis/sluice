<div class="q-actions"><details class="q-answer"{% if !item.ui().is_empty() %} open{% endif %} data-preserve-attr="open"><summary>Answer</summary><div class="answer" id="answer-{{ item.project }}-{{ item.id() }}" data-ignore-morph data-url="{{ item.reply_url() }}" data-key="{{ item.project }}/{{ item.id() }}" data-owner-question="{% if item.recipient() == "owner" %}true{% else %}false{% endif %}" data-ui="{{ item.ui() }}">
<form method="post" action="{{ item.reply_url() }}"><label class="vh" for="reply-{{ item.project }}-{{ item.id() }}">Your answer to {{ item.title() }}</label><textarea id="reply-{{ item.project }}-{{ item.id() }}" name="body" rows="3" required></textarea><button class="primary">Send answer</button></form></div></details><form class="q-close" method="post" action="{{ item.reply_url() }}"><input type="hidden" name="action" value="close"><button>Close question</button></form></div>

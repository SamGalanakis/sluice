<div class="answer" id="answer-{{ item.project }}-{{ item.id() }}" data-ignore-morph data-url="{{ item.reply_url() }}" data-key="{{ item.project }}/{{ item.id() }}" data-owner-question="{% if item.recipient() == "owner" %}true{% else %}false{% endif %}" data-ui="{{ item.ui() }}">
<form method="post" action="{{ item.reply_url() }}"><textarea name="body" rows="3" required aria-label="Reply to {{ item.title() }}"></textarea><button class="primary">Answer</button><button type="submit" name="action" value="close" class="secondary" formnovalidate>Close question</button></form></div>

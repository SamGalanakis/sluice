{{ crate::views::ui::answer_open()|safe }}{% let owner = item.recipient() == "owner" %}<div class="q-actions"><button type="button" class="q-toggle{% if owner %} primary{% endif %}" aria-expanded="{% if !item.ui().is_empty() %}true{% else %}false{% endif %}" aria-controls="qbox-{{ item.project }}-{{ item.id() }}" data-preserve-attr="aria-expanded">{% if owner %}Answer{% else %}Answer as owner{% endif %}</button><form class="q-close" method="post" action="{{ item.reply_url() }}"><input type="hidden" name="action" value="close"><button>Close question</button></form></div>
<div class="q-box" id="qbox-{{ item.project }}-{{ item.id() }}"{% if !item.ui().is_empty() %} data-open{% endif %} data-preserve-attr="data-open"><div class="answer" id="answer-{{ item.project }}-{{ item.id() }}" data-ignore-morph data-url="{{ item.reply_url() }}" data-key="{{ item.project }}/{{ item.id() }}" data-owner-question="{% if owner %}true{% else %}false{% endif %}" data-ui="{{ item.ui() }}">
<form method="post" action="{{ item.reply_url() }}"><label class="vh" for="reply-{{ item.project }}-{{ item.id() }}">Your answer to {{ item.title() }}</label><textarea id="reply-{{ item.project }}-{{ item.id() }}" name="body" rows="3" required></textarea><button class="primary">Send answer</button></form></div></div>{{ crate::views::ui::answer_close()|safe }}

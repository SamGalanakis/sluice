# The cutover rehearsal harness (docs/design/plan-rows.md §10.10). It is built against the
# release the cutover replaces: scripts/cutover-rehearse checks that release out into a
# temporary worktree, copies this directory to the same place in it and builds there, so the
# path dependencies below are the old release's crates. It is no member of the workspace.
[package]
name = "cutover-rehearsal"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace]

[dependencies]
sluice-model = { path = "../../crates/sluice-model" }
sluice-store = { path = "../../crates/sluice-store" }
sluice-process = { path = "../../crates/sluice-process" }
sluice-runtime = { path = "../../crates/sluice-runtime" }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "process", "signal", "net", "io-util", "sync", "time"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks", "backup", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
json-patch = { version = "=4.2.0" }

[dev-dependencies]
tempfile = { version = "=3.27.0" }
